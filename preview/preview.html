<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人际关系图谱 · 真实插件预览</title>
<style>
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:#f5f5f4;font-size:13px;color:#2c2c2a;
  }
  .pv-bar{
    display:flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;
    border-bottom:1px solid #e7e5e0;flex-wrap:wrap;
  }
  .pv-title{font-size:12px;font-weight:500;margin-right:6px}
  .pv-bar button{
    font-family:inherit;font-size:12px;padding:5px 12px;border-radius:8px;cursor:pointer;
    border:1px solid #e0ded8;background:#fff;color:#5f5e5a;transition:.12s;
  }
  .pv-bar button:hover{background:#f7f7f5}
  .pv-bar button.pv-on{background:#e1f5ee;border-color:#9fe1cb;color:#0f6e56}
  .pv-hint{font-size:11.5px;color:#a3a19a;margin-left:auto}
  #host{height:calc(100vh - 45px);overflow:hidden;background:#fff}
</style>
</head>
<body>
  <div class="pv-bar">
    <span class="pv-title">人际关系图谱 · 真实插件预览</span>
    <button data-scene="plain">明文模式</button>
    <button data-scene="lock">加密模式</button>
    <button data-scene="init">首次使用</button>
    <span class="pv-hint" id="hint"></span>
  </div>
  <div id="host"></div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
